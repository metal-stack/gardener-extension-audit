---
name: metal-stack component release

on:
  pull_request:
    branches:
      - main
  release:
    types:
      - published
  push:
    branches:
      - main

jobs:
  draft:
    uses: metal-stack/actions-common/.github/workflows/release-drafter.yaml@v1

  go-build:
    uses: metal-stack/actions-common/.github/workflows/go-build.yaml@v1
    secrets: inherit
    with:
      build-command: make build
      test-command: make test

  extension-helm-chart:
    uses:  metal-stack/actions-common/.github/workflows/helm-chart.yaml@v1
    secrets: inherit
    with:
      chart-path: charts/${{ github.event.repository.name }}
      container-image-values-patch: image.tag


  extension-hub:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Make tags
        id: tags
        uses: metal-stack/actions-common/.github/actions/push-tags@v1

      - name: Build hub artifacts
        uses: matthias-horne/gardener-extension-example/.github/actions/compatibility@composite-action
        with:
          chart-ref: ghcr.io/${{ github.repository_owner }}/charts/${{ github.event.repository.name }}:${{ steps.tags.outputs.helm_tag }}
          extension-ref: ghcr.io/${{ github.repository_owner }}/extensions/${{ github.event.repository.name }}:${{ steps.tags.outputs.container_tag }}
